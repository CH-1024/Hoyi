<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg"
	 xmlns:xlink="http://www.w3.org/1999/xlink"
	 width="1080" height="1920" viewBox="0 0 1080 1920">
	<title>Hoyi Animated Splash Screen</title>
	<desc>A luminous blue Hoyi wordmark with orbiting particles, pulsing rings and a flowing light trail.</desc>

	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#07152F"/>
			<stop offset=".52" stop-color="#102D5C"/>
			<stop offset="1" stop-color="#071A3A"/>
		</linearGradient>
		<radialGradient id="ambient">
			<stop offset="0" stop-color="#287DFF" stop-opacity=".32"/>
			<stop offset=".55" stop-color="#176BDE" stop-opacity=".10"/>
			<stop offset="1" stop-color="#176BDE" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#8CEBFF"/>
			<stop offset=".42" stop-color="#43B8FF"/>
			<stop offset="1" stop-color="#477BFF"/>
		</linearGradient>
		<linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#FFFFFF"/>
			<stop offset="1" stop-color="#B8DFFF"/>
		</linearGradient>
		<linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#43B8FF" stop-opacity="0"/>
			<stop offset=".5" stop-color="#A6F3FF"/>
			<stop offset="1" stop-color="#43B8FF" stop-opacity="0"/>
		</linearGradient>
		<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
			<feGaussianBlur stdDeviation="16" result="blur"/>
			<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
		<filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
			<feGaussianBlur stdDeviation="34"/>
		</filter>
		<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="24"/>
		</filter>
		<clipPath id="screen"><rect width="1080" height="1920"/></clipPath>
	</defs>

	<g clip-path="url(#screen)">
		<rect width="1080" height="1920" fill="url(#bg)"/>
		<ellipse cx="540" cy="850" rx="570" ry="610" fill="url(#ambient)"/>
		<ellipse cx="540" cy="850" rx="260" ry="260" fill="#2E8CFF" opacity=".13" filter="url(#softGlow)">
			<animate attributeName="opacity" values=".08;.22;.08" dur="4s" repeatCount="indefinite"/>
			<animate attributeName="rx" values="220;310;220" dur="4s" repeatCount="indefinite"/>
		</ellipse>

		<!-- Subtle background stars -->
		<g fill="#BCEBFF">
			<circle cx="145" cy="380" r="3" opacity=".45"><animate attributeName="opacity" values=".15;.7;.15" dur="3.1s" repeatCount="indefinite"/></circle>
			<circle cx="895" cy="470" r="2.5" opacity=".55"><animate attributeName="opacity" values=".2;.8;.2" dur="2.7s" repeatCount="indefinite"/></circle>
			<circle cx="220" cy="1170" r="2" opacity=".5"><animate attributeName="opacity" values=".1;.7;.1" dur="3.8s" repeatCount="indefinite"/></circle>
			<circle cx="865" cy="1260" r="3" opacity=".4"><animate attributeName="opacity" values=".1;.65;.1" dur="3.3s" repeatCount="indefinite"/></circle>
			<circle cx="760" cy="300" r="2" opacity=".5"/>
			<circle cx="315" cy="520" r="2" opacity=".35"/>
			<circle cx="760" cy="1370" r="2.5" opacity=".35"/>
		</g>

		<!-- Expanding halo rings -->
		<g fill="none" stroke="#65CFFF" transform="translate(540 820)">
			<circle r="205" stroke-width="2" opacity=".20">
				<animate attributeName="r" values="185;285;185" dur="5s" repeatCount="indefinite"/>
				<animate attributeName="opacity" values=".25;0;.25" dur="5s" repeatCount="indefinite"/>
			</circle>
			<circle r="255" stroke-width="1.5" opacity=".14">
				<animate attributeName="r" values="235;340;235" dur="5s" begin="1.4s" repeatCount="indefinite"/>
				<animate attributeName="opacity" values=".18;0;.18" dur="5s" begin="1.4s" repeatCount="indefinite"/>
			</circle>
			<circle r="315" stroke-width="1" stroke-dasharray="3 18" opacity=".25">
				<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
			</circle>
		</g>

		<!-- Orbiting light points -->
		<g transform="translate(540 820)">
			<g>
				<circle cx="0" cy="-286" r="7" fill="#B9F7FF" filter="url(#glow)"/>
				<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
			</g>
			<g>
				<circle cx="0" cy="-235" r="5" fill="#4EAFFF" filter="url(#glow)"/>
				<animateTransform attributeName="transform" type="rotate" from="180" to="-180" dur="9s" repeatCount="indefinite"/>
			</g>
			<g>
				<circle cx="0" cy="-340" r="3.5" fill="#FFFFFF">
					<animate attributeName="r" values="2;6;2" dur="2s" repeatCount="indefinite"/>
				</circle>
				<animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="18s" repeatCount="indefinite"/>
			</g>
		</g>

		<!-- Central emblem: two flowing speech forms -->
		<g transform="translate(540 805)" filter="url(#glow)">
			<path d="M-142 -54 C-142 -125 -88 -174 -12 -174 C62 -174 116 -125 116 -57 C116 10 64 58 -10 58 C-38 58 -62 51 -83 38 L-135 70 L-119 13 C-134 -6 -142 -29 -142 -54Z"
				  fill="url(#blue)" opacity=".86">
				<animateTransform attributeName="transform" type="translate" values="0 0;8 7;0 0" dur="3.8s" repeatCount="indefinite"/>
			</path>
			<!--			<path d="M-110 -55 C-110 -98 -76 -127 -30 -127 C16 -127 49 -98 49 -56 C49 -14 16 15 -30 15 C-46 15 -62 11 -75 3 L-106 23 L-98 -11 C-106 -23 -110 -38 -110 -55Z"-->
			<!--				  fill="#123F82" opacity=".2">-->
			<!--				<animateTransform attributeName="transform" type="translate" values="0 0;8 7;0 0" dur="3.8s" repeatCount="indefinite"/>-->
			<!--			</path>-->
			<!--			<path d="M-96 -49 C-96 -78 -72 -100 -42 -100" fill="none" stroke="#E1FAFF" stroke-width="8" stroke-linecap="round" opacity=".6"/>-->
			<circle cx="-29" cy="-25" r="8" fill="#EAFBFF"/>
			<circle cx="6" cy="-25" r="8" fill="#EAFBFF"/>
			<circle cx="41" cy="-25" r="8" fill="#EAFBFF"/>
		</g>

		<!-- Light sweep across the emblem -->
		<path d="M300 820 C420 720 620 700 790 810" fill="none" stroke="url(#trail)" stroke-width="5" opacity=".9" filter="url(#glow)">
			<animate attributeName="stroke-dasharray" values="0 700;300 700;0 700" dur="3.4s" repeatCount="indefinite"/>
			<animate attributeName="stroke-dashoffset" values="0;-700" dur="3.4s" repeatCount="indefinite"/>
		</path>

		<!-- Wordmark -->
		<g transform="translate(540 1120)">
			<text x="0" y="0" text-anchor="middle"
				  font-family="Arial Rounded MT Bold, Nunito, system-ui, sans-serif"
				  font-size="158" font-weight="800" letter-spacing="-8"
				  fill="url(#word)">hoyi</text>
			<text x="0" y="1" text-anchor="middle"
				  font-family="Arial Rounded MT Bold, Nunito, system-ui, sans-serif"
				  font-size="158" font-weight="800" letter-spacing="-8"
				  fill="none" stroke="#DDF7FF" stroke-width="1.5" opacity=".55">hoyi</text>
			<animateTransform attributeName="transform" type="translate" values="540 1128;540 1114;540 1128" dur="3.8s" repeatCount="indefinite"/>
		</g>

		<!-- Tagline -->
		<text x="540" y="1215" text-anchor="middle"
			  font-family="Arial, sans-serif" font-size="27"
			  letter-spacing="9" fill="#A9D9FF" opacity=".88">CONNECT  ·  SHARE  ·  TOGETHER</text>

		<!-- Animated loading indicator -->
		<!--		<g transform="translate(540 1535)">-->
		<!--			<rect x="-74" y="-3" width="148" height="6" rx="3" fill="#FFFFFF" opacity=".13"/>-->
		<!--			<rect x="-74" y="-3" width="44" height="6" rx="3" fill="url(#blue)">-->
		<!--				<animate attributeName="x" values="-74;30;-74" dur="1.65s" repeatCount="indefinite"/>-->
		<!--				<animate attributeName="width" values="44;66;44" dur="1.65s" repeatCount="indefinite"/>-->
		<!--			</rect>-->
		<!--		</g>-->
		<!--		<text x="540" y="1595" text-anchor="middle"-->
		<!--			  font-family="Arial, sans-serif" font-size="20"-->
		<!--			  letter-spacing="5" fill="#7FB5E9" opacity=".72">STARTING</text>-->

		<!-- Bottom accent -->
		<!--		<path d="M390 1770 H690" stroke="#4AAEFF" stroke-width="2" opacity=".25" stroke-linecap="round"/>-->
		<!--		<circle cx="540" cy="1770" r="4" fill="#8DEBFF" filter="url(#glow)">-->
		<!--			<animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/>-->
		<!--		</circle>-->
	</g>
</svg>