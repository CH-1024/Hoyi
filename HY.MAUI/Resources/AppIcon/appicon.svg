<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">

	<defs>
		<linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#12B9F5"></stop>
			<stop offset="45%" stop-color="#2165F5"></stop>
			<stop offset="100%" stop-color="#9635F5"></stop>
		</linearGradient>

		<linearGradient id="topGlow" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#FFFFFF" stop-opacity=".18"></stop>
			<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
		</linearGradient>

		<linearGradient id="bottomGlow" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#FFFFFF" stop-opacity=".13"></stop>
			<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
		</linearGradient>

		<clipPath id="clip">
			<rect width="1024" height="1024" rx="230"></rect>
		</clipPath>
	</defs>

	<g clip-path="url(#clip)">
		<!-- 主背景 -->
		<rect width="1024" height="1024" fill="url(#background)"></rect>

		<!-- 右上装饰 -->
		<path d="M690 0 H1024 V310
             C850 310 690 155 690 0Z" fill="url(#topGlow)"></path>

		<!-- 左下装饰 -->
		<path d="M0 700
             C180 650 390 750 480 1024
             H0Z" fill="url(#bottomGlow)"></path>
	</g>
</svg>
